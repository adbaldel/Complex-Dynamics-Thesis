[project]
name = "tfg-complex-dynamics"
version = "0.1.0"
description = "Python package for Iterating Rational Functions"
requires-python = ">=3.10"
dependencies = [
    "antlr4-python3-runtime==4.11.0",
    "ipykernel>=7.3.0",
    "ipympl>=0.10.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.0.0",
    "jupyterlab>=4.6.1",
    "matplotlib>=3.7.0",
    "neopyter>=0.4.0",
    "notebook>=6.5.0",
    "numba>=0.57.0",
    "numpy>=1.24.0",
    "pytest>=9.1.1",
    "pyvista[all]>=0.48.4",
    "scipy>=1.10.0",
    "sympy>=1.14.0",
    "tqdm>=4.65.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.22",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
